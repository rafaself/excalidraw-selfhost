name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@5d1605cbc68a09337ad0d5654e237e03253b5879 # v1
        with:
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Validate API request limits
        run: pnpm test:api-limits

      - name: Validate deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions configuration: ${name}"
              missing=1
            fi
          done

          if (( missing )); then
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9A-Fa-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character Cloudflare account ID."
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_PAGES_PROJECT_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT_NAME is not a valid Pages project name."
            exit 1
          fi

      - name: Verify provisioned Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          response="$RUNNER_TEMP/cloudflare-pages-project.json"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT_NAME}" \
            --output "$response"

          node --input-type=module - "$response" "$CLOUDFLARE_PAGES_PROJECT_NAME" <<'NODE'
          import { readFileSync } from "node:fs";

          const [file, expectedProject] = process.argv.slice(2);
          const body = JSON.parse(readFileSync(file, "utf8"));

          if (body.success !== true || body.result?.name !== expectedProject) {
            console.error("::error::Configured Cloudflare Pages project was not found.");
            process.exit(1);
          }

          if (body.result.production_branch !== "main") {
            console.error("::error::Cloudflare Pages production branch must be main before deployment.");
            process.exit(1);
          }
          NODE

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          pnpm exec wrangler pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
